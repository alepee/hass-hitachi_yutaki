name: Validate

# PRs and main reach these jobs through ci.yml, only when they touch the
# integration; the nightly run catches upstream changes to HACS and hassfest.
on:
  workflow_call:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
  validate-hass:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@master"
