name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Each push to a PR replaces its previous run. On main every run completes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts a PR touches, so the jobs it cannot break stay off: a docs-only
  # PR runs none of them. A push to main runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' }}
      integration: ${{ github.event_name == 'push' || steps.filter.outputs.integration == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - 'custom_components/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            integration:
              - 'custom_components/**'
              - 'hacs.json'
              - 'README.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/validate.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint with ruff
        run: uv run ruff check custom_components tests

      - name: Check translation keys
        run: uv run python scripts/check_translations.py

  # ty is still 0.0.x: advisory only, left out of the `ci` result. Findings
  # surface as annotations without blocking the PR.
  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Type-check the domain layer with ty
        run: uv run ty check custom_components/hitachi_yutaki/domain

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # pytest-homeassistant-custom-component (phac) pins a specific HA version.
    # To test against a given HA release, install the matching phac version.
    #
    # HA version  | phac version
    # ------------|-------------
    # 2025.1.0    | 0.13.201
    # 2025.2.0    | 0.13.210
    # 2025.3.0    | 0.13.221
    # 2025.4.0    | 0.13.232
    # 2025.5.0    | 0.13.243
    # 2025.6.0    | 0.13.251
    # 2025.7.0    | 0.13.260
    # 2025.8.0    | 0.13.269
    # 2025.9.0    | 0.13.277
    # 2025.10.0   | 0.13.285
    # 2025.11.0   | 0.13.294
    # 2025.12.0   | 0.13.298
    # 2026.1.0    | 0.13.305
    # 2026.2.0    | 0.13.313
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported HA version
          # pycares 4.9+ leaves a shutdown thread that HA 2025.1's test
          # harness reports as lingering; that release shipped with an older one.
          - ha-version: "2025.1.0"
            phac-version: "0.13.201"
            python-version: "3.13"
            extra-pins: "pycares<4.9"
          # Latest HA available on each Python, as locked in uv.lock: newer HA
          # releases need Python 3.14, so the 3.13 job stays on HA 2026.2.
          - ha-version: "latest"
            phac-version: ""
            python-version: "3.13"
          - ha-version: "latest"
            phac-version: ""
            python-version: "3.14"

    name: "Tests (HA ${{ matrix.ha-version }} / Python ${{ matrix.python-version }})"

    # Without it uv follows .python-version, whatever the matrix says.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Pin HA ${{ matrix.ha-version }}
        if: matrix.phac-version != ''
        env:
          EXTRA_PINS: ${{ matrix.extra-pins }}
        run: |
          # EXTRA_PINS is left unquoted on purpose: one argument per pin.
          # shellcheck disable=SC2086
          uv pip install --prerelease=allow pytest-homeassistant-custom-component==${{ matrix.phac-version }} $EXTRA_PINS

      # --no-sync keeps uv run from reverting the pinned HA to the locked one.
      - name: Show resolved HA version
        run: uv run --no-sync python -c "import sys; from homeassistant.const import __version__; print('HA version:', __version__, '/ Python', sys.version.split()[0])"

      # pytest-xdist comes with phac: one worker per runner core.
      - name: Run tests with pytest
        run: uv run --no-sync pytest -n auto

  validate:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/validate.yml

  # The single required check: skipped jobs pass, so a required check per job
  # would stay pending on a PR that does not run it (a skipped matrix job is
  # not even reported under its expanded name).
  ci:
    runs-on: ubuntu-latest
    needs: [changes, lint, test, validate]
    if: always()
    steps:
      - name: Every job passed, or the PR leaves its files alone
        run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}, validate: ${{ needs.validate.result }}"
          test "${{ needs.changes.result }}" = success
          for result in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.validate.result }}"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
