name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # pytest-homeassistant-custom-component (phac) pins a specific HA version.
    # To test against a given HA release, install the matching phac version.
    #
    # HA version  | phac version
    # ------------|-------------
    # 2025.1.0    | 0.13.201
    # 2025.2.0    | 0.13.210
    # 2025.3.0    | 0.13.221
    # 2025.4.0    | 0.13.232
    # 2025.5.0    | 0.13.243
    # 2025.6.0    | 0.13.251
    # 2025.7.0    | 0.13.260
    # 2025.8.0    | 0.13.269
    # 2025.9.0    | 0.13.277
    # 2025.10.0   | 0.13.285
    # 2025.11.0   | 0.13.294
    # 2025.12.0   | 0.13.298
    # 2026.1.0    | 0.13.305
    # 2026.2.0    | 0.13.313
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported HA version
          # pycares 4.9+ leaves a shutdown thread that HA 2025.1's test
          # harness reports as lingering; that release shipped with an older one.
          - ha-version: "2025.1.0"
            phac-version: "0.13.201"
            python-version: "3.13"
            extra-pins: "pycares<4.9"
          # Latest HA available on each Python, as locked in uv.lock: newer HA
          # releases need Python 3.14, so the 3.13 job stays on HA 2026.2.
          - ha-version: "latest"
            phac-version: ""
            python-version: "3.13"
          - ha-version: "latest"
            phac-version: ""
            python-version: "3.14"

    name: "Tests (HA ${{ matrix.ha-version }} / Python ${{ matrix.python-version }})"

    # Without it uv follows .python-version, whatever the matrix says.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Pin HA ${{ matrix.ha-version }}
        if: matrix.phac-version != ''
        env:
          EXTRA_PINS: ${{ matrix.extra-pins }}
        run: |
          # EXTRA_PINS is left unquoted on purpose: one argument per pin.
          # shellcheck disable=SC2086
          uv pip install --prerelease=allow pytest-homeassistant-custom-component==${{ matrix.phac-version }} $EXTRA_PINS

      # --no-sync keeps uv run from reverting the pinned HA to the locked one.
      - name: Show resolved HA version
        run: uv run --no-sync python -c "import sys; from homeassistant.const import __version__; print('HA version:', __version__, '/ Python', sys.version.split()[0])"

      - name: Run tests with pytest
        run: uv run --no-sync pytest
