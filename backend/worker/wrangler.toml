name = "hitachi-telemetry"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "hitachi-telemetry-archive"

[[analytics_engine_datasets]]
binding = "AE"
dataset = "hitachi_installations"

# Fleet ping (#468): one datapoint per unit, no identifier.
[[analytics_engine_datasets]]
binding = "PING"
dataset = "hitachi_fleet_ping"

# Publish the previous UTC day's fleet stats (public/stats.json in R2).
# Needs the CF_ACCOUNT_ID and AE_API_TOKEN secrets (Account Analytics Read).
[triggers]
crons = ["30 0 * * *"]

[observability]
[observability.logs]
enabled = true
# Invocation logs record each request with its metadata, and cannot be turned
# off per route. Off, so the anonymous fleet ping leaves no request trace
# (#468); console.warn/error output is still collected.
invocation_logs = false
